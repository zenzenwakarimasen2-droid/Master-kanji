<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flash card - Belajar Bahasa Jepang</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #0a0a0a; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            min-height: 100vh; 
            overflow-x: hidden;
        }

        /* Animasi Transisi Halus */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease forwards;
        }
        
        /* --- STYLE HALAMAN UTAMA (HOME) --- */
        #home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
        }

        .main-title {
            font-size: clamp(20px, 3vw, 30px);
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 35px;
            text-align: center;
            line-height: 1.5;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            width: 100%;
            padding-bottom: 40px;
        }

        .menu-card {
            background-color: #111;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 110px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .menu-card:active {
            background-color: #fff;
            color: #000;
            transform: scale(0.95);
        }

        .menu-card h3 { font-size: 14px; margin-bottom: 5px; letter-spacing: 1px; }
        .menu-card span { font-size: 11px; color: #888; }
        .menu-card:active span { color: #333; }

        /* --- ANIMASI & STYLE BADGE PRO LUXURY --- */
        @keyframes goldShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes lockPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .pro-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: linear-gradient(135deg, #ffd700, #fff8dc, #ffaa00, #ffe600, #b8860b);
            background-size: 300% 300%;
            animation: goldShimmer 4s ease infinite;
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 2px 5px rgba(0,0,0,0.8);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 3px;
            text-transform: uppercase;
            z-index: 5;
        }

        .pro-badge .lock-icon {
            display: inline-block;
            animation: lockPulse 2s infinite ease-in-out;
        }

        /* --- ANIMASI & STYLE BADGE EXCLUSIVE (LEBIH MEWAH DARI PRO) --- */
        @keyframes purpleShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes exclusiveGlow {
            0%, 100% {
                box-shadow: 0 0 8px rgba(186, 85, 255, 0.6), 0 0 18px rgba(138, 43, 226, 0.5), 0 2px 5px rgba(0,0,0,0.8);
            }
            50% {
                box-shadow: 0 0 18px rgba(224, 170, 255, 1), 0 0 38px rgba(186, 85, 255, 0.8), 0 2px 8px rgba(0,0,0,0.9);
            }
        }

        @keyframes gemSpin {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        @keyframes crownFloat {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-2px) rotate(6deg); }
        }

        @keyframes textShimmer {
            0% { background-position: -100% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes sparkleFloat {
            0%, 100% { opacity: 0; transform: scale(0.4) translateY(0); }
            50% { opacity: 1; transform: scale(1) translateY(-3px); }
        }

        .exclusive-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 2px;
            border-radius: 8px;
            z-index: 5;
            pointer-events: none;
        }

        .exclusive-badge::after {
            content: "✨";
            position: absolute;
            top: -10px;
            left: -8px;
            font-size: 11px;
            animation: sparkleFloat 1.8s ease-in-out infinite;
        }

        .exclusive-badge-inner {
            position: relative;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 7px;
            background: linear-gradient(135deg, #2d004d, #8a2be2, #c77dff, #e0aaff, #6a00b3, #ba55ff);
            background-size: 400% 400%;
            animation: purpleShimmer 3s ease infinite, exclusiveGlow 2.2s ease-in-out infinite;
            border: 1px solid rgba(230, 190, 255, 0.9);
        }

        .exclusive-badge .badge-text {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff 0%, #ffd700 25%, #fff 50%, #e0aaff 75%, #fff 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textShimmer 2.5s linear infinite;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }

        .exclusive-badge .crown-icon {
            display: inline-block;
            font-size: 10px;
            animation: crownFloat 1.6s ease-in-out infinite;
        }

        .exclusive-badge .gem-icon {
            display: inline-block;
            animation: gemSpin 3s infinite ease-in-out;
        }

        .menu-card.is-exclusive {
            border: 2px solid transparent;
            background:
                linear-gradient(#111, #111) padding-box,
                linear-gradient(135deg, #ffd700, #8a2be2, #6a00b3, #e0aaff) border-box;
            box-shadow: 0 0 6px rgba(186, 85, 255, 0.5);
        }

        .menu-card.is-exclusive h3,
        .menu-card.is-exclusive span {
            background: linear-gradient(90deg, #fff 0%, #ffd700 25%, #fff 50%, #e0aaff 75%, #fff 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textShimmer 2.5s linear infinite;
        }
        
        /* --- STYLE HALAMAN KUIS (PILIHAN GANDA) --- */
        #quiz-page {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            background: #0a0a0a;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-align: center;
            color: #ffd700;
        }

        #counter { 
            margin-bottom: 25px; 
            font-size: 10px; 
            color: #888; 
            letter-spacing: 2px; 
            font-weight: bold;
        }

        .question-box {
            width: 100%;
            max-width: 320px;
            min-height: 140px;
            background-color: #1a1a1a;
            border: 2px solid #fff;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .prompt-text {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 40px;
        }

        .option-btn {
            background-color: #111;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 25px 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .option-btn.correct {
            border-color: #55ff55;
            background-color: rgba(85, 255, 85, 0.15);
            color: #55ff55;
        }

        .option-btn.wrong {
            border-color: #ff5555;
            background-color: rgba(255, 85, 85, 0.15);
            color: #ff5555;
        }

        .controls {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button.prev-btn {
            background-color: transparent;
            border: 2px solid #ffd700; 
            color: #ffd700;
            width: 100%;
            padding: 14px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.prev-btn:active {
            background-color: #ffd700;
            color: #000;
        }

        button.prev-btn:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        button.shuffle-btn {
            background-color: transparent;
            border: 2px solid #55aaff;
            color: #55aaff;
            width: 100%;
            padding: 14px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.shuffle-btn:active {
            background-color: #55aaff;
            color: #000;
        }

        button.back-btn { 
            background-color: transparent;
            border: 2px solid #ff5555; 
            color: #ff5555; 
            width: 100%; 
            padding: 14px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        button.back-btn:active { 
            background-color: #ff5555; 
            color: #000; 
        }

        /* --- RESPONSIVE: TABLET & LAPTOP/PC --- */
        @media (min-width: 700px) {
            .question-box, .options-grid, .controls {
                max-width: 480px;
            }
            .question-box {
                font-size: 26px;
                min-height: 180px;
            }
            .option-btn {
                font-size: 20px;
                padding: 30px 10px;
            }
        }

        @media (min-width: 1100px) {
            .question-box, .options-grid, .controls {
                max-width: 600px;
            }
            .question-box {
                font-size: 30px;
                min-height: 220px;
            }
        }

    </style>
</head>

        // --- PENGATURAN PASSWORD DECK PRO ---
        const deckPasswords = {
             // <-- CONTOH DEMO, ganti/hapus sesuai kebutuhan
        };

        // --- PENGATURAN PASSWORD DECK EXCLUSIVE (tier di atas Pro) ---
        const exclusivePasswords = {
            shiken_kanji_b10: "xyzz", // <-- CONTOH DEMO, ganti/hapus sesuai kebutuhan
        };

        const homePage = document.getElementById('home-page');
        const quizPage = document.getElementById('quiz-page');
        const deckTitle = document.getElementById('deckTitle');
        const counterEl = document.getElementById('counter');
        const questionBox = document.getElementById('questionBox');
        const optionsGrid = document.getElementById('optionsGrid');
        const promptText = document.querySelector('.prompt-text');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const backBtn = document.getElementById('backBtn');
        const prevBtn = document.getElementById('prevBtn');
        
        let currentDeck = [];
        let currentIndex = 0;
        let currentCorrectAnswer = "";

        function loadCategory(categoryKey, titleText, subtitleText) {
            const dataSet = flashcardData[categoryKey] || [];
            
            if(dataSet.length === 0) {
                alert("early acces, bentar saya coba sempurnain");
                return;
            }

            currentDeck = [...dataSet];
            currentIndex = 0;

            deckTitle.innerText = `${titleText} - ${subtitleText}`;
            
            homePage.style.display = 'none';
            quizPage.style.display = 'flex';
            window.scrollTo(0,0);
            
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= currentDeck.length) {
                questionBox.innerHTML = "<div style='font-size:24px'>すごい🥳🤩🔥!<br><br>Kuis Selesai!</div>";
                optionsGrid.innerHTML = "";
                promptText.style.display = 'none';
                counterEl.innerText = "0 / 0";
                
                prevBtn.disabled = false;
                return;
            }

            if (currentIndex === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            promptText.style.display = 'block';
            const qData = currentDeck[currentIndex];
            
            questionBox.innerText = qData.question;
            currentCorrectAnswer = qData.correct;
            counterEl.innerText = `${currentIndex + 1} / ${currentDeck.length}`;

            let options = [qData.correct, ...qData.wrong];

            options = options.sort(() => 0.5 - Math.random());

            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(btn, opt);
                optionsGrid.appendChild(btn);
            });
        }

        function handleAnswer(btn, selectedAns) {
            const allBtns = document.querySelectorAll('.option-btn');
            
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selectedAns === currentCorrectAnswer) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => {
                    if (b.innerText === currentCorrectAnswer) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentIndex++;
                renderQuestion();
            }, 1200);
        }

        // --- EVENTS ---
        shuffleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentDeck.length > 0) {
                currentDeck = currentDeck.sort(() => 0.5 - Math.random());
                currentIndex = 0;
                renderQuestion();
            }
        });
        
        backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            quizPage.style.display = 'none';
            homePage.style.display = 'flex';
            window.scrollTo(0,0);
        });

        prevBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });

        document.querySelectorAll('.menu-card').forEach(card => {
            const category = card.getAttribute('data-category');
            if (exclusivePasswords[category]) {
                const badge = document.createElement('div');
                badge.className = 'exclusive-badge';
                badge.innerHTML = `
                    <div class="exclusive-badge-inner">
                        <span class="crown-icon">👑</span>
                        <span class="badge-text">Exclusive</span>
                        <span class="gem-icon">💎</span>
                    </div>
                `;
                card.appendChild(badge);
                card.classList.add('is-exclusive');
            } else if (deckPasswords[category]) {
                const badge = document.createElement('div');
                badge.className = 'pro-badge';
                badge.innerHTML = 'PRO <span class="lock-icon">🔒</span>';
                card.appendChild(badge);
            }
        });

        document.querySelectorAll('.menu-card').forEach(menu => {
            menu.addEventListener('click', () => {
                const category = menu.getAttribute('data-category');
                const title = menu.querySelector('h3').innerText;
                const subtitle = menu.querySelector('span').innerText;

                if (exclusivePasswords[category]) {
                    const userInput = prompt(`Deck "${title}" ini EXCLUSIVE 💎, minta password ke : fadir,Razan,arival:`);
                    if (userInput === exclusivePasswords[category]) {
                        loadCategory(category, title, subtitle);
                    } else if (userInput !== null) {
                        alert("Yah, passwordnya salah! Coba inget-inget lagi deh.");
                    }
                } else if (deckPasswords[category]) {
                    const userInput = prompt(`Deck "${title}" digembok, minta password ke : fadir,Razan,arival:`);
                    if (userInput === deckPasswords[category]) {
                        loadCategory(category, title, subtitle);
                    } else if (userInput !== null) {
                        alert("Yah, passwordnya salah! Coba inget-inget lagi deh.");
                    }
                } else {
                    loadCategory(category, title, subtitle);
                }
            });
        });
